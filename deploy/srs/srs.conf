listen              1935;
max_connections     1000;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;
    hls {
        enabled             on;
        hls_fragment        1;
        hls_window          6;
        hls_wait_keyframe   off;
    }
}
