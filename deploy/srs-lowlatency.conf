# SRS — HLS fragments courts pour moins de délai (OBS + Cloudflare + BelKou).
# Dans OBS : Intervalle d'image clé = 1 s (Sortie → Avancé / x264).

listen              1935;
max_connections     1000;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
}

vhost __defaultVhost__ {
    hls {
        enabled             on;
        hls_fragment        1;
        hls_window          4;
        hls_wait_keyframe   off;
    }
}
